<!-- @dsCard group="Controls" height=260 -->
<!-- IrisUi additions: this preview needs ext.css and ext.js beside tokens.css, bundle.css and bundle.js. -->
<div id="root" style="background:var(--bg);color:var(--fg);padding:16px;display:grid;gap:20px;font-family:var(--font-text)"></div>
<script>
(() => {
  const h = React.createElement;
  const { Icon, SectionLabel, Card, Row, Toggle, Button, ButtonGroup, Chip, Field, Segmented, CheckList, Progress, Stat, Skeleton, Orb, StatusPill, TabBar, Topic, Widget, Menu, Dialog, Sheet, Snackbar, Tooltip, Badge, Slider, TextArea, Select, SearchField, Tabs, Steps, EmptyState, Toolbar, DatePicker, TimePicker, AppBar, NavRail, SplitButton, Carousel, Divider, CircleStack, LoopBubble, Photo, BorderPattern, ChatStack } = window.IrisUi;
  window.__dsPreview = {
    "Sort and filter": () => {
  const [picked, setPicked] = React.useState(null);
  return h("div", { style: { display: "grid", gap: 14, minHeight: 200, alignContent: "start" } },
    h(Menu, { label: "Sort", items: [
      { label: "Newest first", checked: picked === "Newest first", onSelect: () => setPicked("Newest first") },
      { label: "By name", checked: picked === "By name", onSelect: () => setPicked("By name") },
      { kind: "label", label: "Show" },
      { label: "Only unread", checked: picked === "Only unread", onSelect: () => setPicked("Only unread") },
      { kind: "sep" },
      { label: "Delete all", danger: true, onSelect: () => setPicked("Delete all") },
    ] }),
    h("div", { style: { fontSize: 13, color: "var(--dim)" } }, picked ? "Chose: " + picked : "Nothing chosen yet"));
},
    "A menu on a Row": () => h(Row, { icon: h(Icon, { name: "wave" }), title: "Voice", subtitle: "Dutch, warm and clear", trailing: h(Menu, { label: "Alex", align: "end", items: [ { label: "Alex", checked: true }, { label: "Calmer" }, { label: "No voice" } ] }) }),
  };
})();

(() => {
  const h = React.createElement, P = window.__dsPreview, root = document.getElementById("root");
  for (const k of Object.keys(P)) {
    const cel = document.createElement("div");
    cel.innerHTML = '<div style="font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 8px 2px">' + k + '</div><div></div>';
    root.appendChild(cel);
    ReactDOM.createRoot(cel.lastChild).render(h(window.IrisUi.PreviewI18nProvider, null, h(P[k])));
  }
})();
</script>
