<!-- @dsCard group="Brand" height=300 -->
<!-- IrisUi additions: this preview needs ext.css and ext.js beside tokens.css, bundle.css and bundle.js. -->
<div id="root" style="background:var(--bg);color:var(--fg);padding:16px;display:grid;gap:20px;font-family:var(--font-text)"></div>
<script>
(() => {
  const h = React.createElement;
  const { Icon, SectionLabel, Card, Row, Toggle, Button, ButtonGroup, Chip, Field, Segmented, CheckList, Progress, Stat, Skeleton, Orb, TalkOrb, Orb3D, THINKING, StatusPill, TabBar, Topic, Widget, Menu, Dialog, Sheet, Snackbar, Tooltip, Badge, Slider, TextArea, Select, SearchField, Tabs, Steps, EmptyState, Toolbar, DatePicker, TimePicker, AppBar, NavRail, SplitButton, Carousel, Mark, Edge, EdgeText, Divider, CircleStack, LoopBubble, Photo, BorderPattern, ChatStack, MacPill, VaultAsk, TableApp, Gauge, Bars, Days } = window.IrisUi;
  window.__dsPreview = {
    "At rest, hover the orb": () => { const [panel, setPanel] = React.useState(null); const [badge, setBadge] = React.useState(2);
  const [state, setState] = React.useState("rest"); const [words, setWords] = React.useState(null);
  const pick = (k) => () => { setPanel(panel === k ? null : k); if (k === "chats") setBadge(0); };
  const talk = () => { setState("thinking"); setWords(null);
    setTimeout(() => { setState("talking"); setWords("Tomorrow at half past nine you have the dentist."); }, 1400);
    setTimeout(() => { setState("rest"); setWords(null); }, 4600); };
  return h("div", { style: { paddingTop: 40 } }, h(MacPill, { state, onPress: talk, badge, words, status: state === "thinking" ? "Thinking" : undefined,
    left: [ { label: "Calls", icon: "phone", active: panel === "calls", onSelect: pick("calls") }, { label: "Chats", icon: "wave", active: panel === "chats", onSelect: pick("chats") } ],
    right: [ { label: "Vault", icon: "shield", active: panel === "vault", onSelect: pick("vault") }, { label: "Settings", icon: "person", active: panel === "settings", onSelect: pick("settings") } ] })); },
    "Muted, with the way back": () => { const [muted, setMuted] = React.useState(true);
  return h(MacPill, { open: true, state: muted ? "muted" : "rest", status: muted ? "Muted" : undefined, back: muted ? { label: "Turn sound on", onClick: () => setMuted(false) } : undefined,
    left: [ { label: "Chats", icon: "wave" } ], right: [ { label: "Talk while held", icon: "mic" } ] }); },
    "Working": () => h(MacPill, { working: true, status: "Booking the table, step 3 of 6" }),
  };
})();

(() => {
  const h = React.createElement, P = window.__dsPreview, root = document.getElementById("root");
  for (const k of Object.keys(P)) {
    const cel = document.createElement("div");
    cel.innerHTML = '<div style="font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 8px 2px">' + k + '</div><div></div>';
    root.appendChild(cel);
    ReactDOM.createRoot(cel.lastChild).render(h(window.IrisUi.PreviewI18nProvider, null, h(P[k])));
  }
})();
</script>
