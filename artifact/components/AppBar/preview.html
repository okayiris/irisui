<!-- @dsCard group="Navigation" height=260 -->
<!-- IrisUi additions: this preview needs ext.css and ext.js beside tokens.css, bundle.css and bundle.js. -->
<div id="root" style="background:var(--bg);color:var(--fg);padding:16px;display:grid;gap:20px;font-family:var(--font-text)"></div>
<script>
(() => {
  const h = React.createElement;
  const { Icon, SectionLabel, Card, Row, Toggle, Button, ButtonGroup, Chip, Field, Segmented, CheckList, Progress, Stat, Skeleton, Orb, TalkOrb, Orb3D, THINKING, StatusPill, TabBar, Topic, Widget, Menu, Dialog, Sheet, Snackbar, Tooltip, Badge, Slider, TextArea, Select, SearchField, Tabs, Steps, EmptyState, Toolbar, DatePicker, TimePicker, AppBar, NavRail, SplitButton, Carousel, Mark, Edge, EdgeText, Divider, CircleStack, LoopBubble, Photo, BorderPattern, ChatStack, MacPill, VaultAsk, TableApp, Gauge, Bars, Days } = window.IrisUi;
  window.__dsPreview = {
    "Small, with actions": () => h("div", null,
    h(AppBar, { title: "Bins", sub: "A loop, every Tuesday", leading: h(Button, { variant: "icon", label: "Back", icon: h("span", { style: { display: "inline-flex", transform: "scaleX(-1)" } }, h(Icon, { name: "chevron", size: 18 })) }),
      actions: h(Button, { variant: "icon", label: "Talk about this loop", icon: h(Icon, { name: "mic", size: 18 }) }) }),
    h(Card, { style: { margin: 16 } }, h(Row, { title: "Next time", subtitle: "Tuesday 6 Oct, out by 8" }), h(Row, { title: "Who", subtitle: "You, she reminds you at 7" }))),
    "Large, the title of a screen": () => h(AppBar, { variant: "large", title: "This week", sub: "Six loops, two waiting on you",
      actions: h(Button, { variant: "icon", label: "New loop", icon: h(Icon, { name: "sparkles", size: 18 }) }) }),
  };
})();

(() => {
  const h = React.createElement, P = window.__dsPreview, root = document.getElementById("root");
  for (const k of Object.keys(P)) {
    const cel = document.createElement("div");
    cel.innerHTML = '<div style="font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 8px 2px">' + k + '</div><div></div>';
    root.appendChild(cel);
    ReactDOM.createRoot(cel.lastChild).render(h(window.IrisUi.PreviewI18nProvider, null, h(P[k])));
  }
})();
</script>
