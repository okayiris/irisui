<!-- @dsCard group="Navigation" height=200 -->
<!-- IrisUi additions: this preview needs ext.css and ext.js beside tokens.css, bundle.css and bundle.js. -->
<div id="root" style="background:var(--bg);color:var(--fg);padding:16px;display:grid;gap:20px;font-family:var(--font-text)"></div>
<script>
(() => {
  const h = React.createElement;
  const { Icon, SectionLabel, Card, Row, Toggle, Button, ButtonGroup, Chip, Field, Segmented, CheckList, Progress, Stat, Skeleton, Orb, StatusPill, TabBar, Topic, Widget, Menu, Dialog, Sheet, Snackbar, Tooltip, Badge, Slider, TextArea, Select, SearchField, Tabs, Steps, EmptyState, Toolbar, DatePicker, TimePicker, AppBar, NavRail, SplitButton, Carousel, Divider } = window.IrisUi;
  window.__dsPreview = {
    "Docked, in a screen": () => h(Toolbar, { title: "This week", items: [
    { label: "New", icon: h(Icon, { name: "sparkles", size: 16 }) },
    { label: "Sort", icon: h(Icon, { name: "loop", size: 16 }) },
    { label: "Only unread", active: true },
    { label: "Unpair", danger: true },
  ], trailing: h(Badge, { count: 3 }, h(Icon, { name: "phone", size: 18 })) }),
    "Floating over content": () => h(Toolbar, { variant: "floating", items: [
    { label: "Read out", icon: h(Icon, { name: "speaker", size: 16 }), active: true },
    { label: "Mark", icon: h(Icon, { name: "loop", size: 16 }) },
    { label: "Delete", danger: true },
  ] }),
  };
})();

(() => {
  const h = React.createElement, P = window.__dsPreview, root = document.getElementById("root");
  for (const k of Object.keys(P)) {
    const cel = document.createElement("div");
    cel.innerHTML = '<div style="font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 8px 2px">' + k + '</div><div></div>';
    root.appendChild(cel);
    ReactDOM.createRoot(cel.lastChild).render(h(window.IrisUi.PreviewI18nProvider, null, h(P[k])));
  }
})();
</script>
