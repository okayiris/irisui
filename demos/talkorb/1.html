<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>(()=>{const d=document.documentElement,set=(m)=>{if(m==="light"||m==="dark")d.dataset.mode=m;else delete d.dataset.mode};try{set(localStorage.getItem("iris-mode"))}catch(e){}addEventListener("storage",(e)=>{if(e.key==="iris-mode")set(e.newValue)})})()</script>
<title>Iris UI preview</title>
<link rel="stylesheet" href="/irisui/ds/tokens.css">
<link rel="stylesheet" href="/irisui/ds/bundle.css">
<link rel="stylesheet" href="/irisui/ds/ext.css">
<link rel="stylesheet" href="/irisui/ds/extra.css">
<link rel="stylesheet" href="/irisui/ds/placeholder.css">
<link rel="stylesheet" href="/irisui/demos.css">
<link rel="icon" href="/favicon.svg">
<style>html,body{margin:0;background:var(--bg)}body{font-family:var(--font-text)}
/* A frame is as narrow as a phone: nothing a preview sets in pixels may push past it. */
#root{box-sizing:border-box;max-width:100%}#root>*{min-width:0;max-width:100%}#root div[style*="width:"]{max-width:100%}#root .ix-macpill div{max-width:none}
/* Orb3D's hero ships with its formula editor: lab tooling. On the component page the orb stands alone. */
[data-demo="orb3d:0"] .o3-controls,[data-demo="orb3d:0"] textarea,[data-demo="orb3d:0"] textarea~*{display:none}</style>
</head><body>
<script src="/irisui/ds/vendor/react.js"></script>
<script src="/irisui/ds/vendor/react-dom.js"></script>
<script src="/irisui/ds/bundle.js"></script>
<script src="/irisui/ds/ext.js"></script>
<!-- @dsCard group="Brand" height=760 -->
<div id="root" style="background:var(--bg);padding:16px;display:flex;flex-direction:column;gap:14px;font-family:var(--font)"></div>
<script>
(() => {
  const h = React.createElement;
  const { TalkOrb, Button } = window.IrisUi;
  const label = t => h("div", { style: { font: "500 10px var(--mono)", letterSpacing: ".14em", textTransform: "uppercase", color: "var(--faint)", marginTop: 34 } }, t);
  const cell = s => h("div", { key: s, style: { display: "flex", flexDirection: "column", alignItems: "center", paddingTop: 30 } }, h(TalkOrb, { state: s }), label(s));

  // A test sound for the spectrogram: a tone gliding from 120 Hz to 5 kHz and back, with a soft octave above.
  // Low sits at the bottom, so the peak climbs both sides to the top and back.
  function Spectrogram() {
    const [an, setAn] = React.useState(null);
    const sound = React.useRef(null);
    const start = () => {
      const ctx = new AudioContext(), analyser = ctx.createAnalyser(), gain = ctx.createGain();
      analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.4; gain.gain.value = 0.12;
      const a = ctx.createOscillator(), b = ctx.createOscillator(), bg = ctx.createGain();
      a.type = "triangle"; b.type = "sine"; bg.gain.value = 0.35;
      const glide = () => { const t = ctx.currentTime;
        for (const [o, k] of [[a, 1], [b, 2]]) { o.frequency.cancelScheduledValues(t); o.frequency.setValueAtTime(120 * k, t);
          o.frequency.exponentialRampToValueAtTime(2500 * k, t + 3); o.frequency.exponentialRampToValueAtTime(120 * k, t + 6); } };
      a.connect(gain); b.connect(bg).connect(gain); gain.connect(analyser).connect(ctx.destination);
      a.start(); b.start(); glide();
      sound.current = { ctx, loop: setInterval(glide, 6000) }; setAn(analyser);
    };
    // Your own voice: the microphone into the analyser only, never to the speakers (no echo).
    const [error, setError] = React.useState("");
    const mic = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const ctx = new AudioContext(), analyser = ctx.createAnalyser();
        analyser.fftSize = 2048; analyser.smoothingTimeConstant = 0.4;
        ctx.createMediaStreamSource(stream).connect(analyser);
        sound.current = { ctx, stream }; setAn(analyser); setError("");
      } catch (e) { setError("No microphone here (" + e.name + "). Open the preview in its own tab and allow it."); }
    };
    const stop = () => { if (sound.current) { clearInterval(sound.current.loop); sound.current.stream?.getTracks().forEach(t => t.stop());
      sound.current.ctx.close(); sound.current = null; } setAn(null); };
    React.useEffect(() => stop, []);
    return h("div", { style: { display: "flex", flexDirection: "column", alignItems: "center", gap: 18, padding: "60px 0 10px" } },
      h(TalkOrb, { state: "talking", size: 120, analyser: an }),
      h("div", { style: { marginTop: 50, display: "flex", gap: 10 } }, an
        ? h(Button, { variant: "glass", size: "sm", onClick: stop }, "Stop")
        : [h(Button, { key: "t", variant: "accent", size: "sm", onClick: start }, "Play test sound"),
           h(Button, { key: "m", variant: "glass", size: "sm", onClick: mic }, "Use my microphone")]),
      error ? h("div", { style: { fontSize: 12, color: "var(--error)" } }, error) : null,
      h("div", { style: { fontSize: 12, color: "var(--dim)", textAlign: "center", maxWidth: 300 } },
        "Test sound: a tone gliding from 120 Hz up to 5 kHz and back. Or talk into your microphone. Low is at the bottom, high at the top."));
  }

  window.__dsPreview = {
    States: () => h("div", { style: { display: "flex", justifyContent: "space-around", flexWrap: "wrap", gap: 18 } }, ["rest", "talking", "expression", "listening", "thinking", "muted", "away"].map(cell)),
    "Spectrogram (test sound or your voice)": () => h(Spectrogram),
    Expression: () => h("div", { style: { display: "grid", placeItems: "center", padding: 70 } }, h(TalkOrb, { state: "expression", size: 120 })),
  };
})();

(() => {
  const h = React.createElement, P = window.__dsPreview, root = document.getElementById("root");
  for (const k of Object.keys(P)) {
    const cell = document.createElement("div");
    cell.innerHTML = '<div style="font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 6px 2px">' + k + '</div><div></div>';
    root.appendChild(cell);
    ReactDOM.createRoot(cell.lastChild).render(h(window.IrisUi.PreviewI18nProvider, null, h(P[k])));
  }
})();
</script>

<script>
(() => {
  const root = document.getElementById("root") ?? document.body.firstElementChild;
  if (!root) return;
  const cells = Array.from(root.children);
  if (!cells.length) return;
  const label = "Spectrogram (test sound or your voice)";
  const text = (el) => (el.textContent || "").replace(/\s+/g, " ").trim();
  const keep = cells.find((el) => text(el).startsWith(label)) ?? cells[1] ?? cells[0];
  for (const el of cells) if (el !== keep) el.remove();
  // The page already names the variant above the frame; the preview's own small caps caption goes.
  const cap = keep.firstElementChild;
  if (cap && /uppercase/.test(cap.getAttribute("style") || "") && text(cap) === label) cap.remove();
  document.documentElement.setAttribute("data-demo", "talkorb:1");
})();
</script>
<script>
(() => {
  const fit = () => {
    for (const el of document.body.children) {
      if (el.tagName === "SCRIPT") continue;
      el.style.zoom = "";
      const W = document.documentElement.clientWidth, w = el.scrollWidth, L = Math.max(0, el.getBoundingClientRect().left);
      if (w + 2 * L > W + 1) el.style.zoom = String((W - 2 * L) / w);
    }
  };
  addEventListener("load", () => setTimeout(fit, 300));
  addEventListener("resize", fit);
})();
</script>
</body></html>
