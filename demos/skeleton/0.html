<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>(()=>{const d=document.documentElement,set=(m)=>{if(m==="light"||m==="dark")d.dataset.mode=m;else delete d.dataset.mode};try{set(localStorage.getItem("iris-mode"))}catch(e){}addEventListener("storage",(e)=>{if(e.key==="iris-mode")set(e.newValue)})})()</script>
<title>Iris UI preview</title>
<link rel="stylesheet" href="/irisui/ds/tokens.css">
<link rel="stylesheet" href="/irisui/ds/bundle.css">
<link rel="stylesheet" href="/irisui/ds/ext.css">
<link rel="stylesheet" href="/irisui/ds/extra.css">
<link rel="stylesheet" href="/irisui/ds/placeholder.css">
<link rel="stylesheet" href="/irisui/demos.css">
<link rel="icon" href="/favicon.svg">
<style>html,body{margin:0;background:var(--bg)}body{font-family:var(--font-text)}
/* A frame is as narrow as a phone: nothing a preview sets in pixels may push past it. */
#root{box-sizing:border-box;max-width:100%}#root>*{min-width:0;max-width:100%}#root div[style*="width:"]{max-width:100%}#root .ix-macpill div{max-width:none}
/* Orb3D's hero ships with its formula editor: lab tooling. On the component page the orb stands alone. */
[data-demo="orb3d:0"] .o3-controls,[data-demo="orb3d:0"] textarea,[data-demo="orb3d:0"] textarea~*{display:none}</style>
</head><body>
<script src="/irisui/ds/vendor/react.js"></script>
<script src="/irisui/ds/vendor/react-dom.js"></script>
<script src="/irisui/ds/bundle.js"></script>
<script src="/irisui/ds/ext.js"></script>
<!-- @dsCard group="Feedback" height=360 -->
<div id="root" style="background:var(--bg);padding:16px;display:flex;flex-direction:column;gap:14px;font-family:var(--font)"></div>
<script>
(() => {
  const h = React.createElement;
  const { Icon, Card, Row, Toggle, Button, Orb, StatusPill, TabBar, Skeleton } = window.IrisUi;
  window.__dsPreview = {
  Row: () => h(Skeleton, null),
  Screen: () => h(Skeleton, {screen:true}),
  };
})();

(() => {
  const h = React.createElement, P = window.__dsPreview, root = document.getElementById("root");
  for (const k of Object.keys(P)) {
    const cell = document.createElement("div");
    cell.innerHTML = '<div style="font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 6px 2px">' + k + '</div><div></div>';
    root.appendChild(cell);
    ReactDOM.createRoot(cell.lastChild).render(h(window.IrisUi.PreviewI18nProvider, null, h(P[k])));
  }
})();
</script>

<script>
(() => {
  const root = document.getElementById("root") ?? document.body.firstElementChild;
  if (!root) return;
  const cells = Array.from(root.children);
  if (!cells.length) return;
  const label = "Row";
  const text = (el) => (el.textContent || "").replace(/\s+/g, " ").trim();
  const keep = cells.find((el) => text(el).startsWith(label)) ?? cells[0] ?? cells[0];
  for (const el of cells) if (el !== keep) el.remove();
  // The page already names the variant above the frame; the preview's own small caps caption goes.
  const cap = keep.firstElementChild;
  if (cap && /uppercase/.test(cap.getAttribute("style") || "") && text(cap) === label) cap.remove();
  document.documentElement.setAttribute("data-demo", "skeleton:0");
})();
</script>
<script>
(() => {
  const fit = () => {
    for (const el of document.body.children) {
      if (el.tagName === "SCRIPT") continue;
      el.style.zoom = "";
      const W = document.documentElement.clientWidth, w = el.scrollWidth, L = Math.max(0, el.getBoundingClientRect().left);
      if (w + 2 * L > W + 1) el.style.zoom = String((W - 2 * L) / w);
    }
  };
  addEventListener("load", () => setTimeout(fit, 300));
  addEventListener("resize", fit);
})();
</script>
</body></html>
