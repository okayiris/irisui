  const ic = (n, s = 18) => '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'

  const st = document.createElement("style"); st.textContent = "\n.pv{font:15px/1.5 var(--font);color:var(--fg);background:var(--bg);padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-font-smoothing:antialiased}\n.pv *{box-sizing:border-box}\n.pv-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}\n.pv-top .label{flex:1}\n.label{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}\n.seg{display:inline-flex;padding:.2rem;border-radius:999px;background:var(--glass);border:1px solid var(--edge)}\n.seg button,.tab,.nav,.btn,.item,.chip,.tb{all:unset;cursor:pointer;transition:background .2s cubic-bezier(.2,.9,.25,1),color .2s,border-color .2s,opacity .2s,scale .15s}\n.seg button{padding:.3rem .8rem;border-radius:999px;font:500 .8rem var(--font);color:var(--dim)}\n.seg button:hover{color:var(--fg)}\n.seg button[aria-pressed=true]{background:rgba(125,211,252,.14);color:var(--accent)}\n:is(.seg button,.tab,.nav,.btn,.item,.chip,.tb):focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n:is(.tab,.nav,.btn,.item,.chip,.tb):active{scale:.96}\n.stage{display:flex;justify-content:center;align-items:flex-start;padding:.5rem 0}\n.app{position:relative;width:60rem;max-width:100%;height:31rem;container-type:inline-size;border:1px solid var(--edge);border-radius:1rem;\n  background:rgba(12,17,23,.9);overflow:hidden;display:flex;transition:width .35s cubic-bezier(.2,.9,.25,1),height .35s cubic-bezier(.2,.9,.25,1)}\n.app.phone{width:23.5rem;height:36rem;border-radius:1.6rem}\n.col{display:flex;flex-direction:column;min-width:0;flex:1}\n.side{width:13rem;flex:none;padding:.9rem .6rem;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:.15rem;background:rgba(7,9,12,.5)}\n.side .brand{display:flex;align-items:center;gap:.5rem;padding:.2rem .6rem .9rem;font-weight:600}\n.side .grp{margin:.9rem .6rem .35rem}\n.nav{display:flex;gap:.6rem;align-items:center;padding:.45rem .6rem;border-radius:.7rem and:hover{background:rgba(125,211,252,.12)}\n.btn.ghost{background:none;width:2.2rem;height:2.2rem;padding:0;border-radius:50%;color:var(--dim)}\n.btn.ghost:hover{background:var(--glass);color:var(--fg)}\n.btn.primary.icon{width:2.2rem;height:2.2rem;padding:0;border-radius:50%}\n.search{display:flex;align-items:center;gap:.5rem;padding:.4rem .8rem;border-radius:999px;background:var(--glass);border:1px solid var(--edge);color:var(--faint);font-size:.88rem;min-width:0}\n.tabbar{display:none;position:absolute;left:.6rem;right:.6rem;bottom:.6rem;height:3.6rem;padding:.3rem;border-radius:999px;background:rgba(20,26,34,.82);\n  border:1px solid var(--edge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:6}\n.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;border-radius:999px;color:var(--dim);font-size:.72rem}\n.tab[aria-current=page]{color:var(--accent);background:rgba(125,211,252,.14)}\n.back{display:none}\n@container (max-width: 40rem){\n  .side{display:none} .tabbar{display:flex} .body{padding-bottom:5rem}\n  .head{padding:.8rem 1rem}\n}\n@media (prefers-reduced-motion: reduce){.app,.seg button,.tab,.nav,.btn,.item,.chip,.tb{transition:none}}\n"; document.head.appendChild(st);
  const root = document.getElementById("root");
  root.innerHTML = '<div class="pv-top"><span class="label">List Detail app</span><div class="seg" role="group" aria-label="Size">'
    + '<button aria-pressed="true" data-size="wide">Window</button><button aria-pressed="false" data-size="phone">Phone</button></div></div>'
    + '<div class="stage"><div class="app" id="app"></div></div>';
  const app = root.querySelector("#app");
  root.querySelector(".seg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    root.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    app.classList.toggle("phone", b.dataset.size === "phone");
  });
  const S = {};
  const draw = () => { app.innerHTML = ((S, ic) => {
    const mails = [["Ruben de Wit","Offer for the garden house","Here is the price for the shed we talked about, including delivery on the 12th.","09:41",1],
      ["Bikepath Foundation","Route update","The South to East stretch is open again from Monday.","08:15",0],
      ["de Wit Bakery","Your order","Two sourdough loaves are ready from 16:00.","Tue",0],
      ["Hetzner","Invoice 2026-09","Your invoice for September is ready.","Mon",0]];
    const i = S.i ?? 0, open = S.open;
    const m = mails[i];
    const list = '<div class="ld-list"><div class="head"><h2>Inbox <span class="sub">4</span></h2><span class="search">' + ic("search", 16) + 'Search</span></div><div class="ld-items">'
      + mails.map(([f, s, p, t, u], k) => '<button class="item ld-item" data-i="' + k + '"' + (k === i ? ' aria-current="true"' : '') + '><span class="ld-top"><b>' + (u ? '<i class="dot"></i>' : '') + f + '</b><span class="dim small">' + t + '</span></span>'

    const detail = '<div class="col ld-detail"><div class="head"><button class="btn ghost ld-back" data-back aria-label="Back">' + ic("chevron-left") + '</button><h2>' + m[1] + '</h2>'
      + '<button class="btn ghost" aria-label="Star">' + ic("star") + '</button><button class="btn ghost" aria-label="Delete">' + ic("trash") + '</button></div>'
      + '<div class="body"><div><b>' + m[0] + '</b> <span class="dim small">' + m[3] + '</span></div><p style="margin:0;max-width:34rem">' + m[2] + '</p>'

    return '<div class="ld' + (open ? ' open' : '') + '">' + list + detail + '</div>';
  })(S, ic); };
  const extra = document.createElement("style"); extra.textContent = ".ld{display:flex;flex:1;min-width:0}.ld-list{width:19rem;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}"
    + ".ld-items{overflow:auto;padding:.4rem;display:flex;flex-direction:column;gap:.15rem}.ld-item{display:flex;flex-direction:column;gap:.1rem;padding:.6rem .7rem;border-radius:.7rem}"
    + ".ld-item:hover{background:var(--glass)}.ld-item[aria-current]{background:rgba(125,211,252,.14)}.ld-top{display:flex;justify-content:space-between;gap:.5rem;font-size:.9rem}"
    + ".ld-s{font-size:.88rem}.ld-p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--accent);margin-right:.4rem;vertical-align:middle}"
    + ".ld-back{display:none}@container (max-width:40rem){.ld-list{width:100%;border:0}.ld-detail{display:none}.ld.open .ld-list{display:none}.ld.open .ld-detail{display:flex}.ld-back{display:inline-flex}}";
  document.head.appendChild(extra);
  app.addEventListener("click", (e) => { const b = e.target.closest("[data-i]"); if (b) { S.i = +b.dataset.i; S.open = true; draw(); return; }
    if (e.target.closest("[data-back]")) { S.open = false; draw(); } });
  draw();
})();
</script>

<script>
(() => {
  const fit = () => {
    for (const el of document.body.children) {
      if (el.tagName === "SCRIPT") continue;
      el.style.zoom = "";
      const W = document.documentElement.clientWidth, w = el.scrollWidth, L = Math.max(0, el.getBoundingClientRect().left);
      if (w + 2 * L > W + 1) el.style.zoom = String((W - 2 * L) / w);
    }
  };
  addEventListener("load", () => setTimeout(fit, 300));
  addEventListener("resize", fit);
})();
</script>
