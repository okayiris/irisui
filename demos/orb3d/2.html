  .o3-btn:hover { color: #2ee6d6; background: rgba(46,230,214,.16); }

  // Hero: talking on a test sound (a tone gliding 120 Hz to 2.5 kHz and back) or your microphone.

        h(Button, { variant: "glass", size: "sm", onClick: () => setParts(parts ? 0 : 1) }, parts ? "Particles off" : "Particles on"), an

  // The 3D orb in the Mac pill: glass bar behind it, a word under it, the steps ring and badge on top.

  const ICON = { loop: ["M19.5 9A8 8 0 0 0 5 7.5M4.5 15A8 8 0 0 0 19 16.5", "M4 3.5v5h5M20 20.5v-5h-5"], chats: ["M4 5h11v8H8l-4 3z", "M18 8h2v8l-3-2h-6v-1"],

      words ? h("div", { className: "o3-above" }, "\u201c" + words + "\u201d")
        : steps ? h("div", { className: "o3-above" }, h("span", { className: "o3-dot" }), steps + " steps") : null,
      h("div", { className: "o3-bar" + (bar || open ? "" : " closed"), style: { left: -120 }, ...hover },

        h("div", { className: "o3-side" }, Btn("vault"), Btn("gear"), Btn("mic", "mic"))),

        h("circle", { r: 43, fill: "none", stroke: "#7dd3fc", strokeWidth: 1.4, strokeLinecap: "round", strokeDasharray: "0.1 5.4", style: { filter: "drop-shadow(0 0 2px rgba(125,211,252,.8))" } })) : null,

  }

    ["Rest", { state: "rest", badge: 3 }],
    ["Talking", { state: "talking", words: "Dim the kitchen lights", bar: true }],
    ["Listening", { state: "listening", label: "LISTENING" }],

    const [k, setK] = React.useState(1), [ring, setRing] = React.useState("deepsea"), [parts, setParts] = React.useState(1);
    return h("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
      h("div", { className: "o3-controls" }, PILL.map(([n], i) => h("button", { key: n, className: i === k ? "on" : "", onClick: () => setK(i) }, n))),
      h("div", { className: "o3-controls" }, ["deepsea", "precession", "fieldlines", "comet-orbit", "silk-wave", "angular-discharge"].map(r =>
        h("button", { key: r, className: r === ring ? "on" : "", onClick: () => setRing(r) }, Orb3D.ringName(r))),
        h("button", { className: parts ? "on" : "", onClick: () => setParts(parts ? 0 : 1) }, "Particles")),
      h(Pill, { key: k + ring, ring, particles: parts, ...PILL[k][1] }),
      h("div", { style: { fontSize: 12, color: "var(--dim)" } }, "Rest the mouse on the orb: the bar grows out from behind it."));
  }

  // Many orbs at once: one WebGL context draws them all, each with its own made-up voice, copied into small canvases.

  // Many orbs at once: one WebGL context draws them all, each with its own made-up voice, copied into small canvases.

    "Rings + particles": () => h(Multi, { size: 150, items: [

      ["fieldlines", "swarm", {}], ["angular-discharge", "orbit", { lines: 3, sprite: "streak", trail: 0.6 }],

(() => {
  const h = React.createElement, P = window.__dsPreview, root = document.getElementById("root");
  for (const k of Object.keys(P)) {
    const cell = document.createElement("div");
    cell.innerHTML = '<div style="font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 6px 2px">' + k + '</div><div></div>';
    root.appendChild(cell);
    ReactDOM.createRoot(cell.lastChild).render(h(window.IrisUi.PreviewI18nProvider, null, h(P[k])));
  }
})();
</script>

<script>
(() => {
  const root = document.getElementById("root") ?? document.body.firstElementChild;
  if (!root) return;
  const cells = Array.from(root.children);
  if (!cells.length) return;
  const label = "Rings + particles";
  const text = (el) => (el.textContent || "").replace(/\s+/g, " ").trim();
  const keep = cells.find((el) => text(el).startsWith(label)) ?? cells[2] ?? cells[0];
  for (const el of cells) if (el !== keep) el.remove();
  // The page already names the variant above the frame; the preview's own small caps caption goes.
  const cap = keep.firstElementChild;
  if (cap && /uppercase/.test(cap.getAttribute("style") || "") && text(cap) === label) cap.remove();
  document.documentElement.setAttribute("data-demo", "orb3d:2");
})();
</script>
<script>
(() => {
  const fit = () => {
    for (const el of document.body.children) {
      if (el.tagName === "SCRIPT") continue;
      el.style.zoom = "";
      const W = document.documentElement.clientWidth, w = el.scrollWidth, L = Math.max(0, el.getBoundingClientRect().left);
      if (w + 2 * L > W + 1) el.style.zoom = String((W - 2 * L) / w);
    }
  };
  addEventListener("load", () => setTimeout(fit, 300));
  addEventListener("resize", fit);
})();
</script>
</body></html>
