<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<script>(()=>{const d=document.documentElement,set=(m)=>{if(m==="light"||m==="dark")d.dataset.mode=m;else delete d.dataset.mode};try{set(localStorage.getItem("iris-mode"))}catch(e){}addEventListener("storage",(e)=>{if(e.key==="iris-mode")set(e.newValue)})})()</script>
<title>Iris UI preview</title>
<link rel="stylesheet" href="/irisui/ds/tokens.css">
<link rel="stylesheet" href="/irisui/ds/bundle.css">
<link rel="stylesheet" href="/irisui/ds/ext.css">
<link rel="stylesheet" href="/irisui/ds/extra.css">
<link rel="stylesheet" href="/irisui/ds/placeholder.css">
<link rel="stylesheet" href="/irisui/demos.css">
<link rel="icon" href="/favicon.svg">
<style>html,body{margin:0;background:var(--bg)}body{font-family:var(--font-text)}
/* A frame is as narrow as a phone: nothing a preview sets in pixels may push past it. */
#root{box-sizing:border-box;max-width:100%}#root>*{min-width:0;max-width:100%}#root div[style*="width:"]{max-width:100%}#root .ix-macpill div{max-width:none}
/* Orb3D's hero ships with its formula editor: lab tooling. On the component page the orb stands alone. */
[data-demo="orb3d:0"] .o3-controls,[data-demo="orb3d:0"] textarea,[data-demo="orb3d:0"] textarea~*{display:none}</style>
</head><body>
<script src="/irisui/ds/vendor/react.js"></script>
<script src="/irisui/ds/vendor/react-dom.js"></script>
<script src="/irisui/ds/bundle.js"></script>
<script src="/irisui/ds/ext.js"></script>
<!-- @dsCard group="Screen parts" height=1500 width=1000 -->
<div id="root" style="background:var(--bg);padding:16px;display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-start;font-family:var(--font)"></div>
<script>
(() => {
  const h = React.createElement;
  const UI = window.IrisUi;
  window.__dsPreview = {
  ...Object.fromEntries([["lanes", "groceries"], ["grid", "agenda"], ["bubbles", "mail"], ["band", "parcel"], ["rain", "weather"], ["drift", "tasks"]].map(([kind, topic]) =>
    ["widget: " + kind, () => h("div", { style: { width: 200 } }, h(UI.Pattern, { kind, topic, height: 100 }, h("span", { style: { fontSize: 13 } }, topic)))])),
  ...Object.fromEntries([
    ["lanes", ["capsule", "circle"], "#04241f", ["#4ade80", "#38bdf8", "#a7f3d0"]], ["grid", ["square"], "#08183a", ["#7dd3fc", "#38bdf8", "#e8f2f7"]],
    ["lanes-round", ["circle", "dot"], "#140f33", ["#8b5cf6", "#7dd3fc", "#f0abfc"]], ["bubbles", ["ring", "circle"], "#18123c", ["#a78bfa", "#c4b5fd", "#7dd3fc"]],
    ["rain", ["triangle", "dot"], "#081a34", ["#38bdf8", "#7dd3fc", "#e8f2f7"]], ["keys", ["square"], "#0b1026", ["#7dd3fc", "#8b5cf6", "#2ee6d6"]],
    ["band", ["capsule"], "#221a0e", ["#fbbf24", "#fde68a", "#7dd3fc"]], ["scan", ["circle"], "#052331", ["#2ee6d6", "#7dd3fc", "#a7f3d0"]],
    ["drift", ["circle", "ring", "arc"], "#140f33", ["#8b5cf6", "#7dd3fc", "#f0abfc", "#2ee6d6"]], ["eq", ["capsule"], "#2c0b26", ["#f0abfc", "#c026d3", "#8b5cf6"]],
    ["spiral", ["plus", "half"], "#0b1026", ["#7dd3fc", "#f0abfc", "#fbbf24"]], ["swarm", ["dot", "circle"], "#062016", ["#a7f3d0", "#4ade80", "#2ee6d6"]],
    ["wave", ["circle"], "#081a34", ["#38bdf8", "#7dd3fc", "#c4b5fd"]],
  ].map(([layout, shapes, background, palette]) => ["recipe: " + layout, () =>
    h("div", { style: { width: 280 } }, h(UI.Pattern, { recipe: { layout, shapes, background, palette, density: 0.45, pop: 0.5, fill: 0.6, confetti: layout === "drift" ? 0.6 : 0.2 } }))])),
  };
})();

(() => {
  const h = React.createElement, P = window.__dsPreview, root = document.getElementById("root");
  for (const k of Object.keys(P)) {
    const cel = document.createElement("div");
    cel.innerHTML = '<div style="font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 6px 2px">' + k + '</div><div></div>';
    root.appendChild(cel);
    ReactDOM.createRoot(cel.lastChild).render(h(window.IrisUi.PreviewI18nProvider, null, h(P[k])));
  }
})();
</script>

<script>
(() => {
  const fit = () => {
    for (const el of document.body.children) {
      if (el.tagName === "SCRIPT") continue;
      el.style.zoom = "";
      const W = document.documentElement.clientWidth, w = el.scrollWidth, L = Math.max(0, el.getBoundingClientRect().left);
      if (w + 2 * L > W + 1) el.style.zoom = String((W - 2 * L) / w);
    }
  };
  addEventListener("load", () => setTimeout(fit, 300));
  addEventListener("resize", fit);
})();
</script>
</body></html>
