# Build the site, run its own gate, and publish it to GitHub Pages.
#
# This file needs a token with the `workflow` scope to be pushed (gh auth refresh -s workflow). Until then the
# same thing is done by `pnpm publish:pages`, which builds with the /irisui prefix and pushes gh-pages.

name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build-artifact
      - run: pnpm build
      - run: npx --yes playwright install --with-deps chromium
      - run: pnpm check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://ui.okayiris.com
    steps:
      - uses: actions/deploy-pages@v4
