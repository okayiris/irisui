<!-- @dsCard group="Showcases" page width=1000 height=1560 subtitle="The web parts in four topics, next to the widget of the same topic" -->
<div id="root" style="background:var(--bg);padding:16px;display:flex;flex-direction:column;gap:22px;font-family:var(--font)"></div>
<script>
(() => {
  const h = React.createElement, { Topic, Card, Chip, Progress, Stat, CheckList, Segmented, Field, Button, ButtonGroup, Widget } = window.IrisUi;
  const DEMO = {
    groceries: { head: "Groceries", w: ["On the list", "5", "to get"], stats: [["5", "to get"], ["€42", "estimate"]], v: 3 / 8, seg: ["List", "Shops", "History"], chips: ["the supermarket", "the bookshop", "the market"], items: ["Milk", "Bread", "Eggs", "Cheese", "Apples"], done: [0, 1, 2], field: "Add something" },
    agenda: { head: "Today", w: ["Today", "14:00", "Dentist"], stats: [["14:00", "next"], ["4", "appointments"]], v: .55, seg: ["Day", "Week", "Month"], chips: ["Work", "Home", "Family"], items: [["09:30", "Stand-up"], ["14:00", "Dentist"], ["16:30", "Call a colleague"], ["19:00", "Dinner at Alex's"]], done: [0], field: "New appointment" },
    mail: { head: "Inbox", w: ["Mail", "3", "important"], stats: [["3", "important"], ["12", "unread"]], v: .25, seg: ["Important", "All", "Sent"], chips: ["Reply", "Later", "Archive"], items: ["Builder: quote", "Tax office", "Alex: Saturday?", "Newsletter"], done: [], field: "Search mail" },
    parcel: { head: "On the way", w: ["On the way", "2", "parcels"], stats: [["2", "parcels"], ["14:00", "first one"]], v: .8, seg: ["Coming", "Delivered"], chips: ["PostNL", "DHL"], items: [["14-17", "Book, today"], ["tomorrow", "Headphones"]], done: [], field: "Track a code" },
  };
  const label = { font: "600 11px var(--mono)", letterSpacing: ".14em", textTransform: "uppercase", color: "var(--k)" };
  function Screen({ name }) {
    const d = DEMO[name], [seg, setSeg] = React.useState(0), [chip, setChip] = React.useState(0), [done, setDone] = React.useState(d.done);
    const toggle = i => setDone(x => x.includes(i) ? x.filter(y => y !== i) : [...x, i]);
    return h(Topic, { name }, h("div", { style: { display: "flex", gap: 12, alignItems: "flex-start" } },
      h(Widget, { look: "glass", size: "small", label: d.w[0], value: d.w[1], unit: d.w[2] }),
      h(Card, { style: { flex: 1, minWidth: 0, padding: 14 } }, h("div", { style: { display: "grid", gap: 14 } },
        h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" } },
          h("div", { style: label }, d.head), h(Segmented, { items: d.seg, active: seg, onSelect: setSeg })),
        h("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr auto", gap: 10, alignItems: "center" } },
          d.stats.map(([v, l]) => h(Stat, { key: l, value: v, label: l })), h(Progress, { ring: true, size: 76, value: d.v, centre: Math.round(d.v * 100) + "%" })),
        h(Progress, { value: d.items.length ? done.length / d.items.length : 0 }),
        h(CheckList, { items: d.items, done, onToggle: toggle }),
        h("div", { style: { display: "flex", gap: 6, flexWrap: "wrap" } }, d.chips.map((c, i) => h(Chip, { key: c, on: i === chip, onClick: () => setChip(i) }, c))),
        h(Field, { placeholder: d.field }),
        h(ButtonGroup, null, h(Button, { variant: "primary" }, "Ask Iris"), h(Button, { variant: "glass" }, "Open"))))));
  }
  window.__dsPreview = {
    "One topic per screen, four screens": () => h("div", { style: { display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(460px,1fr))", gap: 16 } },
      Object.keys(DEMO).map(n => h(Screen, { key: n, name: n }))),
    "Without a topic: the ice accent": () => h(Card, { style: { padding: 14, display: "grid", gap: 12, maxWidth: 460 } },
      h(Segmented, { items: ["All", "Open"], active: 0 }), h(Progress, { value: .4 }), h(CheckList, { items: ["Call the plumber", "Pay the invoice"], done: 1 }),
      h("div", { style: { display: "flex", gap: 6 } }, h(Chip, { on: true }, "Today"), h(Chip, null, "This week")), h(Field, { placeholder: "Search" })),
  };
})();

(() => {
  const h = React.createElement, P = window.__dsPreview, root = document.getElementById("root");
  for (const k of Object.keys(P)) {
    const cell = document.createElement("div");
    cell.innerHTML = '<div style="font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 6px 2px">' + k + '</div><div></div>';
    root.appendChild(cell);
    ReactDOM.createRoot(cell.lastChild).render(h(window.IrisUi.PreviewI18nProvider, null, h(P[k])));
  }
})();
</script>
