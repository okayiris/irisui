<!-- @dsCard group="Controls" height=200 width=720 -->
<div id="root" style="background:var(--bg);padding:16px;display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-start;font-family:var(--font)"></div>
<script>
(() => {
  const h = React.createElement;
  const UI = window.IrisUi;
  window.__dsPreview = {
  "Agenda set": () => h(UI.ButtonGroup, { topic: "agenda" },
    h(UI.Button, { variant: "primary" }, "Schedule it"), h(UI.Button, { variant: "glass" }, "Later"), h(UI.Button, { variant: "text" }, "Details"),
    h(UI.Button, { variant: "danger" }, "Delete"), h(UI.Button, { variant: "icon", label: "Notification", icon: h(UI.Icon, { name: "speaker", size: 18 }) }),
    h(UI.Button, { variant: "primary", busy: true }, "Busy"), h(UI.Button, { variant: "glass", disabled: true }, "Not now"), h(UI.Toggle, { on: true })),
  "Parcel set": () => h(UI.ButtonGroup, { topic: "parcel" }, h(UI.Button, { variant: "primary" }, "Track parcel"), h(UI.Button, { variant: "glass" }, "Other address"), h(UI.Toggle, { on: false })),
  };
})();

(() => {
  const h = React.createElement, P = window.__dsPreview, root = document.getElementById("root");
  for (const k of Object.keys(P)) {
    const cell = document.createElement("div");
    cell.innerHTML = '<div style="font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 6px 2px">' + k + '</div><div></div>';
    root.appendChild(cell);
    ReactDOM.createRoot(cell.lastChild).render(h(window.IrisUi.PreviewI18nProvider, null, h(P[k])));
  }
})();
</script>
