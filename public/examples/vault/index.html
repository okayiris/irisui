<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Iris UI examples: vault</title>
<meta name="description" content="The vault: one question for access, asked the same way on the phone, the Mac and in Chrome.">
<link rel="stylesheet" href="../../ds/tokens.css">
<link rel="stylesheet" href="../../ds/bundle.css">
<link rel="stylesheet" href="../../ds/ext.css">
<link rel="stylesheet" href="../../ds/extra.css">
<link rel="stylesheet" href="../shared.css">
<link rel="icon" href="../../favicon.svg">
<style>
  .stage { display: grid; gap: 14px; }
  .switch { display: flex; justify-content: center; }
  .cap { font: var(--text-label); color: var(--label); margin: 0; text-align: center; }

  /* The phone: a small IrisApp, the question as its sheet. */
  .phone-wrap { display: grid; justify-items: center; }
  .mini-phone { width: 320px; height: 680px; border-radius: 44px; position: relative; overflow: hidden; transform: translateZ(0);
                box-shadow: 0 0 0 1px var(--edge), 0 0 0 8px var(--glass), 0 0 0 9px var(--edge); }
  .mini-phone .ia-scroll { padding-top: 44px; }

  /* The Mac and Chrome: a desk in the house colours. */
  .desk { border-radius: var(--radius-card); overflow: hidden; box-shadow: 0 0 0 1px var(--edge); padding: 32px 24px; display: grid; place-items: center; min-height: 520px;
          background: radial-gradient(60% 50% at 20% 20%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
                      radial-gradient(55% 50% at 84% 80%, color-mix(in srgb, var(--violet) 18%, transparent), transparent 70%), var(--bg); }
  .win { width: 100%; max-width: 460px; border-radius: var(--radius-card); background: var(--bg); box-shadow: 0 0 0 1px var(--edge); overflow: hidden;
         animation: rise var(--motion-base) var(--ease-house); }
  .win-top { height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 12px; border-bottom: 1px solid var(--line); font: var(--text-sub); color: var(--dim); }
  .win-top i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
  .win-top span { flex: 1; text-align: center; margin-right: 40px; }
  .win-body { padding: 18px 20px 20px; display: grid; gap: 14px; }
  .btns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .done { font: var(--text-body); color: var(--dim); margin: 0; }

  /* The question itself: the same lines on every surface. */
  .q-title { font: var(--text-row-title); font-weight: 600; margin: 0; line-height: 1.3; }
  .facts { display: grid; gap: 8px; margin: 0; }
  .fact { display: grid; grid-template-columns: 58px 1fr; gap: 10px; font: var(--text-body); line-height: 1.35; }
  .fact dt { font: var(--text-label); color: var(--label); padding-top: 3px; }
  .fact dd { margin: 0; }
  .fact dd.unknown { color: var(--wait); }
  .scope { font: var(--text-sub); color: var(--dim); margin: 0; padding: 8px 10px; border-radius: var(--radius-button); background: var(--glass); }

  /* Chrome: the site behind, the extension's popup on top. */
  .browser { width: 100%; max-width: 720px; border-radius: var(--radius-card); overflow: hidden; box-shadow: 0 0 0 1px var(--edge); background: var(--bg); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .url { flex: 1; height: 28px; border-radius: var(--radius-pill); background: var(--glass); display: flex; align-items: center; padding: 0 12px; font: var(--text-sub); color: var(--dim); }
  .page { position: relative; min-height: 360px; padding: 24px; }
  .site { width: 260px; display: grid; gap: 10px; opacity: .5; }
  .site h3 { margin: 0; font: var(--text-page-title); }
  .popup { position: absolute; right: 12px; top: 8px; width: 320px; animation: rise var(--motion-base) var(--ease-house); }
  .popup .win-body { padding: 14px; }

  /* The PIN: Face ID or Touch ID comes first, this is the way in when they cannot. */
  .lock { width: 100%; max-width: 420px; padding: 32px 24px 26px; border-radius: var(--radius-card); text-align: center; display: grid; justify-items: center; gap: 12px;
          background: var(--bg); box-shadow: 0 0 0 1px var(--edge); }
  .lock h2 { margin: 4px 0 0; font: var(--text-page-title); }
  .lock .ask { margin: 0; font: var(--text-body); color: var(--dim); max-width: 320px; }
  .lock .ask b { color: var(--fg); font-weight: 500; }
  .pins { position: relative; display: flex; gap: 8px; margin: 8px 0 2px; cursor: text; }
  .pins.shake { animation: shake .3s var(--ease-house); }
  @keyframes shake { 25% { transform: translateX(-8px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }
  .pin { width: 44px; height: 52px; border-radius: var(--radius-button); display: grid; place-items: center; background: var(--glass); box-shadow: inset 0 0 0 1px var(--edge);
         font: 600 22px var(--font-mono); transition: box-shadow var(--motion-fast) var(--ease-house); }
  .pin.at { box-shadow: inset 0 0 0 2px var(--accent); }
  .pin.ok { box-shadow: inset 0 0 0 2px var(--ok); }
  .pins input { position: absolute; inset: 0; opacity: 0; font-size: 16px; }
  .lock .msg { min-height: 20px; margin: 0; font: var(--text-body); color: var(--dim); }
  .lock .msg.ok { color: var(--ok); }
  .under { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }

  /* The vault itself: a window with the NavRail, the app bar with search and Add. */
  .vault { position: relative; width: 100%; max-width: 880px; display: grid; grid-template-columns: auto minmax(0, 1fr); height: 480px;
           border-radius: var(--radius-card); overflow: hidden; background: var(--bg); box-shadow: 0 0 0 1px var(--edge); }
  .vault > .ix-rail { height: 100%; border: 0; border-right: 1px solid var(--line); border-radius: 0; }
  .vault .main { min-width: 0; overflow: auto; position: relative; }
  .vault .ix-appbar-row { flex-wrap: wrap; }
  .vault .snack { position: absolute; left: 50%; bottom: 16px; translate: -50% 0; z-index: 50; }
  .sheet-body { display: grid; gap: 14px; }
  @media (max-width: 760px) { .vault { grid-template-columns: 1fr; height: auto; min-height: 480px; } .vault > .ix-rail { display: none; } .desk { padding: 16px 8px; } }
</style>
</head>
<body data-platform="vault">
<script src="../nav.js"></script>
<div id="root"></div>
<script src="../../ds/vendor/react.js"></script>
<script src="../../ds/vendor/react-dom.js"></script>
<script src="../../ds/bundle.js"></script>
<script src="../../ds/ext.js"></script>
<script src="../scenes.js"></script>
<script>
(() => {
  const h = React.createElement;
  const { useState, useEffect } = React;
  const { Button, Mark, Segmented, IrisApp, checkApp, Card, Row, NavRail, Sheet, Snackbar, Toggle, Field, Icon, Dialog, VaultAsk, TableApp } = window.IrisUi;

  // The fields src/vault-ask.ts sends; every surface renders the same ones, in the same order.
  const SCOPE = {
    names: "Only the names are read. No value leaves the vault.",
    use: "One value is used for this, and never shown to Iris.",
    store: "A new secret is stored in your vault.",
  };
  const NOT_SAID = "the asker did not say";
  const ASKS = {
    use: { title: "Iris wants your shop.example.com login", who: "Iris, your assistant", from: "Chrome on this Mac, shop.example.com",
           why: "You asked her to order the groceries for Saturday", what: "Fills in your password on shop.example.com", scope: "use" },
    names: { title: "Iris wants to see which logins you have", who: "Iris, your assistant", from: "Her own house",
             why: "You asked which shops she can order from", what: "Reads the list of names", scope: "names" },
    store: { title: "Save the new da-mario.example password?", who: "The Chrome extension", from: "Chrome on this Mac, da-mario.example",
             why: "You made an account to book the table for Sam's party", what: "Stores it, so Iris can sign in next time", scope: "store" },
    blind: { title: "Iris wants a card", who: "Iris, your assistant", from: "Her own house", why: null, what: null, scope: "use" },
  };
  const yes = (a) => (a.scope === "store" ? "Save with Face ID" : "Allow once with Face ID");

  // The phone: a real screen behind (what Iris is doing), the question as the sheet on top of it.
  const phoneSpec = (a) => ({
    name: "Vault", start: "doing",
    screens: {
      doing: { title: a.scope === "store" ? "Sam's party" : "Groceries", eyebrow: "Iris is on it",
        lede: a.why ? `**Alex**, ${a.why[0].toLowerCase() + a.why.slice(1)}. I need the vault for one step.` : "**Alex**, I need the vault for one step.",
        parts: [{ c: "Group", parts: [{ c: "Row", icon: "shield", title: a.title, subtitle: "Waits on you", on: "sheet:ask" }] }] },
      ask: { kind: "sheet", title: "Iris vault",
        parts: [{ c: "VaultAsk", title: a.title, who: a.who, from: a.from, why: a.why ?? undefined, does: a.what ?? undefined, scope: a.scope,
          onAllow: `close;snack:${a.scope === "store" ? "Saved" : "Allowed once"}. Face ID confirmed.`,
          ...(a.scope === "use" && a.why ? { onAlways: "close;snack:Allowed for this site. Face ID confirmed." } : {}),
          onDeny: "close;snack:Nothing was shared. Iris is told no." }] },
    },
  });

  const Facts = ({ a }) => h(React.Fragment, null,
    h("p", { className: "q-title" }, a.title),
    h("dl", { className: "facts" },
      [["Who", a.who], ["From", a.from], ["Why", a.why], ["Does", a.what]].map(([k, v]) =>
        h("div", { key: k, className: "fact" }, h("dt", null, k), h("dd", { className: v ? "" : "unknown" }, v ?? NOT_SAID)))),
    h("p", { className: "scope" }, SCOPE[a.scope]));

  // The Mac asks with the house VaultAsk, Touch ID instead of Face ID.
  function Mac({ a }) {
    const [said, setSaid] = useState(null);
    return h("div", { className: "desk" }, h("div", { className: "win", role: "dialog", "aria-label": a.title },
      h("div", { className: "win-top" }, h("i"), h("i"), h("i"), h("span", null, "Iris vault")),
      h("div", { className: "win-body" },
        said ? h(React.Fragment, null, h("p", { className: "q-title" }, a.title), h("p", { className: "done", role: "status" }, said))
          : h(VaultAsk, { title: a.title, who: a.who, from: a.from, why: a.why ?? undefined, does: a.what ?? undefined, scope: a.scope, biometric: "Touch ID",
              onAllow: () => setSaid("Touch ID confirmed. The phone's question closed by itself."),
              onAlways: () => setSaid("Allowed for this site. Touch ID confirmed."),
              onDeny: () => setSaid("Nothing was shared. Iris is told no.") }))));
  }

  function Chrome({ a }) {
    const [gone, setGone] = useState(false);
    const host = a.from.split(", ")[1] ?? "okayiris.com";
    return h("div", { className: "desk" }, h("div", { className: "browser" },
      h("div", { className: "bar" }, h("div", { className: "url" }, host)),
      h("div", { className: "page" },
        h("div", { className: "site", "aria-hidden": "true" }, h("h3", null, "Sign in"), h(Field, { value: "alex@example.com", readOnly: true, tabIndex: -1 }), h(Field, { type: "password", value: "", readOnly: true, tabIndex: -1 })),
        h("div", { className: "popup win", role: "dialog", "aria-label": "Iris in Chrome" }, h("div", { className: "win-body" },
          h("p", { className: "q-title" }, a.title),
          h("p", { className: "scope" }, SCOPE[a.scope]),
          gone ? h("p", { className: "done", role: "status" }, "Cancelled. Nothing was shared.")
            : h(React.Fragment, null,
                h("p", { className: "done" }, "Answer on your phone or with Touch ID."),
                h("div", { className: "btns" }, h(Button, { variant: "text", size: "sm", onClick: () => setGone(true) }, "Cancel"))))))));
  }

  function Ask({ id }) {
    const a = ASKS[id];
    const [dev, setDev] = useState(0);
    const spec = React.useMemo(() => phoneSpec(a), [id]);
    return h("main", { className: "stage" },
      h("div", { className: "switch" }, h(Segmented, { items: ["Phone", "Mac", "Chrome"], active: dev, onSelect: setDev })),
      dev === 0 ? h("div", { className: "phone-wrap" }, h("div", { className: "mini-phone" }, h(IrisApp, { key: id, spec, start: ["doing", "ask"] })))
        : dev === 1 ? h(Mac, { key: id, a }) : h(Chrome, { key: id, a }),
      h("p", { className: "cap" }, "All three ask at the same time. The first answer wins, the others close."));
  }

  /* ------------------------------------------------------------------- PIN */

  // One pad for both jobs: unlock (enter) and choose (twice). Six digits submit themselves, no OK button.
  function Pin({ mode }) {
    const [step, setStep] = useState(mode === "choose" ? "choose" : "enter");
    const [first, setFirst] = useState("");
    const [value, setValue] = useState("");
    const [show, setShow] = useState(false);
    const [state, setState] = useState(null);      // null | "bad" | "ok"
    const [shake, setShake] = useState(false);
    const [forgot, setForgot] = useState(false);
    const done = (v) => {
      if (step === "choose") { setFirst(v); setStep("repeat"); setValue(""); return; }
      const good = step === "repeat" ? v === first : v === "123456";
      if (good) { setState("ok"); return; }
      setState("bad"); setShake(true);
      setTimeout(() => { setShake(false); setValue(""); }, 450);
      if (step === "repeat") setTimeout(() => { setStep("choose"); setFirst(""); }, 450);
    };
    const type = (e) => {
      const v = e.target.value.replace(/\D/g, "").slice(0, 6);
      setValue(v); if (state === "bad") setState(null);
      if (v.length === 6) done(v);
    };
    const title = { enter: "Enter your PIN", choose: "Choose a PIN of 6 digits", repeat: "Once more, to be sure" }[step];
    const msg = forgot ? "Open Iris on your phone: You, Vault, New PIN. Face ID confirms it is you."
      : state === "ok" ? (mode === "choose" ? "Your PIN is set." : "The vault is open, on this Mac and in Chrome.")
      : state === "bad" ? (step === "choose" && mode === "choose" ? "The two did not match. Choose again." : "Wrong PIN. Try again.") : "";
    return h("main", { className: "desk" }, h("div", { className: "lock", role: "dialog", "aria-label": title },
      h(Mark, { size: 64 }),
      h("h2", null, "Iris"),
      h("p", { className: "ask" }, title),
      h("label", { className: "pins" + (shake ? " shake" : "") },
        Array.from({ length: 6 }, (_, i) => h("span", { key: i, "aria-hidden": "true",
          className: "pin" + (state === "ok" ? " ok" : state !== "bad" && i === Math.min(value.length, 5) ? " at" : "") },
          value[i] ? (show ? value[i] : "•") : "")),
        h("input", { autoFocus: true, inputMode: "numeric", autoComplete: mode === "choose" ? "new-password" : "current-password",
                     "aria-label": title, value, onChange: type, disabled: state === "ok" })),
      h("p", { className: "msg" + (state === "ok" ? " ok" : ""), role: "status" }, msg),
      mode === "enter" ? h("p", { className: "ask" }, h("b", null, "Chrome"), " wants the vault: fills in your password on shop.example.com.") : null,
      h("div", { className: "under" },
        h(Button, { variant: "text", size: "sm", onClick: () => setShow(!show) }, show ? "Hide digits" : "Show digits"),
        mode === "enter" ? h(Button, { variant: "text", size: "sm", onClick: () => setForgot(true) }, "Forgot your PIN?") : null)));
  }

  /* ------------------------------------------------------------------ vault */

  const START = {
    Logins: [{ t: "shop.example.com", u: "alex@example.com", s: "Used by Iris today, 14:10", on: true }, { t: "da-mario.example", u: "alex@example.com", s: "Saved today", on: true },
             { t: "bank.example", u: "alex", s: "Iris may only read the name", on: false }],
    Cards: [{ t: "Visa ending 4412", u: "Alex", s: "Used once, 12 September", on: true }],
    "2FA codes": [{ t: "shop.example.com", u: "6 digits, every 30 s", s: "Filled in by Chrome today", on: true }],
    Notes: [{ t: "Wi-Fi at home", u: "", s: "Never shared", on: false }],
  };
  const ICON = { Logins: "person", Cards: "shield", "2FA codes": "phone", Notes: "globe" };
  // The vault window: the house NavRail for the groups, the house TableApp for the items, Add next to its search.
  function Vault() {
    const [items, setItems] = useState(START);
    const [group, setGroup] = useState("Logins");
    const [adding, setAdding] = useState(false);
    const [confirm, setConfirm] = useState(null);
    const [draft, setDraft] = useState({ t: "", u: "" });
    const [snack, setSnack] = useState(null);
    useEffect(() => { if (!snack) return; const t = setTimeout(() => setSnack(null), 3200); return () => clearTimeout(t); }, [snack]);
    const setOn = (i, on) => setItems((all) => ({ ...all, [group]: all[group].map((x, k) => (k === i ? { ...x, on } : x)) }));
    const rows = items[group].map((it, i) => ({ id: it.t + i, icon: ICON[group], title: it.t, subtitle: [it.u, it.s].filter(Boolean).join(", "), tags: [it.on ? "Iris may use" : "Locked"],
      detail: h("div", { className: "sheet-body" },
        h(Card, { padding: 4 },
          h(Row, { title: "••••••••", subtitle: "Value", trailing: h(Button, { variant: "glass", size: "sm", onClick: () => setSnack("Copied after Touch ID. Clears in 30 seconds.") }, "Copy") }),
          h(Row, { title: "Iris may use it", subtitle: "Touch ID each time", trailing: h(Toggle, { on: it.on, onChange: (v) => setOn(i, v) }) })),
        h(Button, { variant: "danger", onClick: () => setConfirm(i) }, "Remove from the vault")) }));
    return h("main", { className: "desk" }, h("div", { className: "vault" },
      h(NavRail, { label: "Vault", items: Object.keys(items).map((g) => ({ label: `${g} (${items[g].length})`, icon: h(Icon, { name: ICON[g], size: 18 }), active: g === group, onSelect: () => setGroup(g) })) }),
      h("div", { className: "main" }, h(TableApp, { key: group + items[group].length, title: group, rows, filters: ["Iris may use", "Locked"], noun: group.toLowerCase(),
        placeholder: `Search ${group.toLowerCase()}`, empty: "Nothing here yet.",
        actions: h(Button, { variant: "primary", size: "sm", onClick: () => { setDraft({ t: "", u: "" }); setAdding(true); } }, "Add") })),
      snack ? h("div", { className: "snack" }, h(Snackbar, { text: snack, tone: "ok" })) : null,
      h("div", { className: "ia-layer" },
        confirm !== null ? h(Dialog, { open: true, onClose: () => setConfirm(null), title: `Remove ${items[group][confirm]?.t}?`, body: "Iris can no longer use it, on any device. This cannot be undone.",
          actions: [{ label: "Remove", danger: true, onClick: () => { const t = items[group][confirm].t; setItems({ ...items, [group]: items[group].filter((_, k) => k !== confirm) }); setSnack(`${t} is removed from the vault.`); } }, { label: "Keep it" }] }) : null,
        adding ? h(Sheet, { open: true, side: "end", title: `Add to ${group.toLowerCase()}`, sub: "It goes into your vault. Iris sees only the name.", onClose: () => setAdding(false) },
          h("form", { className: "sheet-body", onSubmit: (e) => { e.preventDefault(); if (!draft.t.trim()) return;
              setItems({ ...items, [group]: [...items[group], { t: draft.t.trim(), u: draft.u.trim(), s: "Added just now", on: false }] }); setAdding(false); setSnack(`${draft.t.trim()} is in the vault.`); } },
            h(Field, { autoFocus: true, placeholder: "Name, for example shop.example.com", "aria-label": "Name", value: draft.t, onChange: (e) => setDraft({ ...draft, t: e.target.value }) }),
            h(Field, { placeholder: "User or detail", "aria-label": "User", value: draft.u, onChange: (e) => setDraft({ ...draft, u: e.target.value }) }),
            h(Button, { variant: "primary", size: "lg", disabled: !draft.t.trim() }, "Add"))) : null)));
  }

  const FOUND = Object.keys(ASKS).flatMap((k) => checkApp(phoneSpec(ASKS[k])).map((f) => `${k}: ${f.screen}: ${f.rule}`));
  const Stage = ({ scene }) => scene.id === "pin" ? h(Pin, { mode: "enter" })
    : scene.id === "choose" ? h(Pin, { mode: "choose" })
    : scene.id === "vault" ? h(Vault)
    : h(Ask, { id: scene.id });

  window.exampleScenes({
    title: "Vault",
    stage: Stage,
    scenes: [
      { id: "use", name: "Use one login",
        ok: ["One device at a time: the switch shows the same question on each", "The same lines on every device: who, from, why, what it does, how far", "On the phone a real IrisApp: the house VaultAsk in a sheet over what Iris is doing", "The Mac asks with the house VaultAsk, Touch ID instead of Face ID"],
        ask: ["'Always for this site': how long is always?"].concat(FOUND) },
      { id: "names", name: "Only the names",
        ok: ["Says plainly that no value leaves the vault"], ask: ["Does reading names need Face ID at all?"] },
      { id: "store", name: "Save a new one",
        ok: ["The extension asks, not Iris: 'who' says so"] },
      { id: "blind", name: "Nobody said why",
        ok: ["What nobody said reads 'the asker did not say'", "No 'Always' when there is no reason"],
        ask: ["No 'why': may she still ask, or does the vault refuse on its own?"] },
      { sep: "Unlock" },
      { id: "pin", name: "Unlock with PIN",
        ok: ["Face ID or Touch ID first, the PIN only when they cannot", "Six digits open by themselves: no OK button", "A wrong PIN shakes once and clears, in plain words, not red", "Forgot says how to get a new one"],
        note: "Type 123456 to open. Anything else shakes." },
      { id: "choose", name: "Choose a PIN",
        ok: ["Twice, the title says which time", "Two that do not match start over, with one line why"],
        note: "Type any six digits, then the same six again." },
      { sep: "Vault" },
      { id: "vault", name: "The vault itself",
        ok: ["The house NavRail for groups, the house TableApp for items: search, chips, count, Add", "Every item opens: copy after Touch ID, the toggle, remove last", "Remove is the only red, and asks first"],
        ask: ["Where does the vault live on the phone: under You, or its own tab?", "The house Icon has no card, key or note: Cards use shield, codes phone, notes globe."] },
    ],
    all: { label: "Whole vault", items: ["Real brands in the question (a bank, a shop) or always the site's own name?", "There is no Touch ID or Face ID glyph in the house Icon: the words say it."] },
  });
})();
</script>
</body>
</html>
